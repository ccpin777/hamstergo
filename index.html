<title>HamsterGo · 倉鼠打包小幫手</title>
<link rel="preload" as="image" href="resources/hamstergo-icon.webp" type="image/webp">
<style>
  @font-face{font-family:"Gochi Hand";src:url("resources/fonts/GochiHand-Regular.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Permanent Marker";src:url("resources/fonts/PermanentMarker-Regular.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Caveat";src:url("resources/fonts/Caveat.ttf") format("truetype");font-weight:100 900;font-display:swap;}
  :root{
    --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --brand-font:var(--font-display);
    --font-mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --paper:#FAF7F0;
    --paper-dim:#F1ECE0;
    --navy:#1B2A4A;
    --navy-soft:#4A5A78;
    --amber:#E8A33D;
    --red:#C15B4A;
    --line:#D9D2BF;
    --green:#5E8C6A;
    --font-scale:1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--navy);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(232,163,61,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(232,163,61,0.08), transparent 40%);
    font-family:var(--font-body);
    color:var(--navy);
    padding:28px 14px 60px;
    display:flex;
    justify-content:center;
  }
  .pass{ width:100%; max-width:460px; }
  .header-strip{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    color:var(--paper); padding:0 6px 14px;
  }
  .sync-indicator{ display:inline-flex; align-items:center; justify-content:center; width:14px; height:28px; color:var(--paper-dim); cursor:default; }
  .sync-indicator-dot{ width:8px; height:8px; border-radius:50%; background:#9CA3AF; box-shadow:0 0 0 2px rgba(156,163,175,0.18); }
  .sync-indicator[data-state="syncing"] .sync-indicator-dot{ background:#E8A33D; box-shadow:0 0 0 2px rgba(232,163,61,0.2); }
  .sync-indicator[data-state="success"] .sync-indicator-dot{ background:#72B87A; box-shadow:0 0 0 2px rgba(114,184,122,0.22); }
  .sync-indicator[data-state="error"] .sync-indicator-dot{ background:#D96A5A; box-shadow:0 0 0 2px rgba(217,106,90,0.22); }
  .header-strip .brand{
    text-align:left;
    font-family:var(--font-display); font-weight:600; letter-spacing:0.02em;
    font-size:calc(15px * var(--font-scale, 1)); color:var(--amber); text-transform:none;
    flex:1; min-width:0; white-space:pre-line; text-align:left; flex:1; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-title{font-family:var(--brand-font); font-size:calc(15px * var(--font-scale, 1));}
  .brand-subtitle{font-family:var(--font-body);}
  .brand-separator{display:inline;}
  html[data-app-font] .brand-separator{display:none;}
  html[data-app-font] .header-strip{align-items:flex-end;}
  html[data-app-font] .header-strip .header-actions{align-self:flex-end; transform:translateY(8px);}
  html[data-app-font] .header-strip .brand{line-height:1.15;}
  html[data-app-font] .brand-title, html[data-app-font] .brand-subtitle{display:block;}
  html[data-app-font] .brand-title{font-size:calc(25px * var(--font-scale, 1));}
  .edit-toggle{
    font-family:var(--font-display); font-size:calc(11px * var(--font-scale, 1)); letter-spacing:0.015em;
    text-transform:none; color:var(--paper-dim); background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25); border-radius:14px; padding:5px 12px;
    cursor:pointer;
  }
  .edit-toggle.active{ background:var(--amber); color:var(--navy); border-color:var(--amber); font-weight:600; }
  .header-actions{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .toolbar-btn{
    width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center;
    color:var(--paper-dim); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
    border-radius:50%; cursor:pointer;
  }
  .toolbar-btn:active, .toolbar-btn.active{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .toolbar-btn svg{ width:15px; height:15px; }
  .export-btn{
    height:28px; width:28px; padding:0; justify-content:center; display:flex; align-items:center; gap:5px;
    color:var(--paper-dim); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
    border-radius:16px; cursor:pointer; font-family:var(--font-display); font-size:11px; letter-spacing:0.01em;
  }
  .export-btn:active{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .export-btn svg{ width:14px; height:14px; }
  .settings-btn{
    width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center;
    color:var(--paper-dim); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
    border-radius:50%; cursor:pointer;
  }
  .settings-btn:active, .settings-btn.open{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .settings-btn svg{ width:15px; height:15px; }

  @media (max-width:420px){
    .header-strip{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      align-items:end;
      gap:8px;
      padding-bottom:14px;
    }
    html:not([data-app-font]) .header-strip .brand{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .header-strip .brand{
      grid-column:1;
      grid-row:1;
      display:block;
      width:auto;
      margin:0;
      white-space:normal;
      overflow:visible;
      text-overflow:clip;
      line-height:1.35;
    }
    .header-actions{
      grid-column:2;
      grid-row:1;
      justify-content:flex-end;
      align-self:end;
      transform:translateY(8px);
    }
  }
  .settings-panel{
    display:none; margin:0 0 12px; padding:14px 16px; color:var(--paper);
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:12px;
  }
  .settings-panel.show{ display:block; }
  .settings-title{ font-size:13px; font-weight:600; margin-bottom:10px; }
  .font-options{ display:flex; gap:7px; margin-bottom:14px; }
  .font-option{ flex:1; padding:7px 4px; font-size:12px; color:var(--paper-dim); background:transparent;
    border:1px solid rgba(255,255,255,0.25); border-radius:8px; cursor:pointer; }
  .font-option.active{ color:var(--navy); background:var(--amber); border-color:var(--amber); font-weight:600; }
  html[data-app-font="gochi-hand"]{--brand-font:"Gochi Hand",cursive;}
  html[data-app-font="permanent-marker"]{--brand-font:"Permanent Marker",cursive;}
  html[data-app-font="caveat"]{--brand-font:"Caveat",cursive;}
  html[data-app-font="marker-felt"]{--brand-font:"Marker Felt","Bradley Hand",cursive;}
  .font-family-select-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:2px; margin-bottom:16px; color:var(--paper-dim); font-size:13px; font-weight:600; }
  .font-family-select{ min-width:0; width:158px; padding:7px 9px; color:var(--navy); background:var(--paper); border:1px solid var(--line); border-radius:8px; font:inherit; }
  .lens-setting{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; margin-bottom:16px; color:var(--paper-dim); font-size:12px; }
  .lens-setting input{ width:70px; padding:7px 8px; color:var(--navy); background:var(--paper); border:1px solid var(--line); border-radius:8px; font:inherit; text-align:center; }
  .sync-setting{ display:flex; align-items:center; gap:8px; margin:0 0 9px; }
  .sync-setting label{ flex:0 0 76px; color:var(--paper-dim); font-size:12px; }
  .sync-setting input{ flex:1; min-width:0; padding:7px 8px; color:var(--navy); background:var(--paper); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:12px; }
  .sync-password-wrap{ display:flex; flex:1; min-width:0; }
  .sync-password-wrap input{ width:100%; border-radius:8px 0 0 8px; }
  .sync-password-toggle{ width:36px; border:1px solid var(--line); border-left:0; border-radius:0 8px 8px 0; color:var(--navy-soft); background:var(--paper); cursor:pointer; }
  .sync-password-toggle svg{ width:16px; height:16px; }
  .sync-note{ margin:-2px 0 10px 84px; color:var(--paper-dim); font-size:10px; line-height:1.4; }
  .sync-actions{ display:flex; gap:8px; margin:4px 0 7px; }
  .account-setting, .account-actions, .account-status{ display:none !important; }
  .account-actions{ display:flex; gap:8px; margin:4px 0 10px; }
  .account-btn{ flex:1; padding:8px 7px; color:var(--paper-dim); background:transparent; border:1px solid rgba(255,255,255,0.25); border-radius:8px; cursor:pointer; font-size:12px; }
  .account-btn:active{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .account-status{ min-height:16px; margin:0 0 10px; color:var(--paper-dim); font-size:11px; }
  .legacy-sync-details{ margin-top:8px; }
  .legacy-sync-details summary{ color:var(--paper-dim); cursor:pointer; font-size:11px; margin-bottom:10px; }
  .sync-btn{ flex:1; padding:8px 7px; color:var(--paper-dim); background:transparent; border:1px solid rgba(255,255,255,0.25); border-radius:8px; cursor:pointer; font-size:12px; }
  .sync-btn:active{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .sync-status{ min-height:16px; margin:0 0 12px; color:var(--paper-dim); font-size:11px; }
  .data-title{ margin-top:8px; margin-bottom:10px; }
  .data-actions{ display:flex; gap:8px; margin-top:0; }
  .data-btn{ flex:1; padding:8px 10px; color:var(--paper-dim); background:transparent; border:1px solid rgba(255,255,255,0.25); border-radius:8px; cursor:pointer; font-size:12px; }
  .data-btn:active{ background:var(--amber); color:var(--navy); border-color:var(--amber); }
  .trip-title{
    flex:1 1 180px; min-width:0; width:auto; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:0 0 8px;
    margin:0; background:transparent; color:var(--navy);
    font-family:var(--font-display); font-size:calc(18px * var(--font-scale, 1)); font-weight:600;
    letter-spacing:0.01em; outline:none;
  }
  .trip-title::placeholder{ color:var(--navy-soft); opacity:0.65; }
  .trip-title:focus{ border-bottom-color:var(--amber); }
  .ticket{
    background:var(--paper); border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35); overflow:hidden; position:relative;
  }
  .ticket-top{ padding:22px 24px 0; }
  .route{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .packed-recheck{
    display:none; flex:0 0 30px; width:30px; height:30px; padding:0 !important;
    align-items:center; justify-content:center; line-height:1; overflow:hidden;
  }
  .recheck-icon{ width:18px; height:18px; display:block; flex:0 0 18px; }
  .status-layout{ display:flex; align-items:center; gap:8px; }
  .status-copy{ flex:1; min-width:0; }
  .route h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(calc(16px * var(--font-scale, 1)), 4vw, calc(22px * var(--font-scale, 1))); line-height:1.2; margin:0; color:var(--navy); white-space:nowrap; text-overflow:ellipsis; }
  #pctHeadline{ white-space:normal; }
  .status-pending{ display:block; }
  .status-copy .progress-track{ width:100%; }
  .status-copy .progress-label{ text-align:left; }
  .status-mascot{ width:140px; height:140px; flex:0 0 140px; object-fit:contain; display:block; }
  .mascot-reset-btn{ width:140px; height:140px; flex:0 0 140px; padding:0; border:0; background:transparent; cursor:default; touch-action:manipulation; }
  .mascot-reset-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:4px; border-radius:12px; }
  .route .dot{ display:none; }
  .subtitle{ font-size:calc(13px * var(--font-scale, 1)); color:var(--navy-soft); margin:0 0 18px; }
  .trip-meta{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 14px; margin-bottom:18px; }
  .flight-info{ box-sizing:border-box; height:47px; margin:2px 24px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper-dim); overflow:hidden; }
  .flight-info.editing{ height:auto; overflow:visible; }
  .flight-info-toggle{ width:100%; display:flex; align-items:center; gap:8px; height:100%; padding:6px 14px; border:0; background:transparent; color:var(--navy); font:600 calc(14.5px * var(--font-scale, 1)) var(--font-display); text-align:left; cursor:pointer; }
  .flight-info-summary{ margin-left:auto; color:var(--navy-soft); font-weight:400; white-space:pre-line; text-align:left; flex:1; overflow:hidden; text-overflow:ellipsis; }
  .flight-info-summary{ line-height:1.2; }
  .flight-info-chevron{ color:var(--navy-soft); font-size:15px; transition:transform .15s ease; }
  .flight-info-toggle[aria-expanded="true"] .flight-info-chevron{ transform:rotate(180deg); }
  .flight-info-body{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px 12px; }
  .flight-leg{ display:grid; grid-template-columns:1fr; gap:8px; grid-column:1 / -1; padding-top:10px; border-top:1px solid var(--line); }
  .flight-leg:first-child{ padding-top:0; border-top:0; }
  .flight-leg-title{ grid-column:1 / -1; color:var(--navy); font:700 calc(11px * var(--font-scale, 1)) var(--font-display); }
  .flight-leg-remove{ margin-left:auto; padding:3px 7px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--navy-soft); font:400 calc(10px * var(--font-scale, 1)) var(--font-display); cursor:pointer; }
  .flight-add-btn{ grid-column:1 / -1; justify-self:center; margin-top:2px; }
  .flight-info-field{ display:flex; flex-direction:column; gap:4px; color:var(--navy-soft); font-size:calc(11px * var(--font-scale, 1)); }
  .flight-info-field.departure-field{ grid-column:1 / -1; }
  .flight-info-field input{ width:100%; box-sizing:border-box; padding:8px 9px; border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--navy); font:inherit; font-size:calc(13px * var(--font-scale, 1)); outline:0; }
  .flight-info-field input:focus{ border-color:var(--amber); }
  .days-row{ display:flex; align-items:center; gap:5px; flex:0 0 auto; margin:0; }
  .days-row label{ font-family:var(--font-display); font-size:calc(11px * var(--font-scale, 1)); letter-spacing:0.015em; text-transform:none; color:var(--navy-soft); }
  .days-input{ display:flex; align-items:center; gap:5px; }
  .days-input .val{
    -webkit-appearance:none; -moz-appearance:textfield; appearance:none; width:38px; height:30px; padding:2px 0;
    border:0; border-bottom:1px solid var(--line); border-radius:0; outline:0;
    background:transparent; color:var(--navy); font-family:var(--font-mono); font-weight:700;
    font-size:calc(17px * var(--font-scale, 1)); text-align:center;
  }
  .days-input .val::-webkit-inner-spin-button, .days-input .val::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .days-input .val:focus{ border-bottom-color:var(--amber); }
  .days-input .unit{ font-family:var(--font-display); font-size:calc(13px * var(--font-scale, 1)); color:var(--navy-soft); letter-spacing:0.01em; }
  .progress-track{ height:8px; background:var(--line); border-radius:5px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--navy); box-shadow:0 0 10px rgba(27,42,74,0.5); width:0%; transition:width 0.35s ease; }
  .progress-label{ font-family:var(--font-mono); font-size:calc(11px * var(--font-scale, 1)); color:var(--navy-soft); margin-top:6px; text-align:right; }
  .perforation{ position:relative; height:0; border-top:2px dashed var(--line); margin:4px 0 0; }
  .perforation::before, .perforation::after{ content:""; position:absolute; top:-11px; width:22px;height:22px; border-radius:50%; background:var(--navy); }
  .perforation::before{ left:-25px; } .perforation::after{ right:-25px; }
  .section{ padding:18px 24px; }
  .section + .section{ border-top:1px solid var(--line); }
  .section-title{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:calc(12px * var(--font-scale, 1)); font-weight:700; letter-spacing:0.02em; text-transform:none; color:var(--navy); margin-bottom:10px; }
  .section-title .idx{ font-family:var(--font-mono); color:var(--amber); font-weight:700; }
  .section-collapse-btn{
    margin-left:auto; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:50%; padding:0;
    background:var(--paper-dim); color:var(--navy-soft); cursor:pointer;
  }
  .section-collapse-btn svg{ width:14px; height:14px; transition:transform 0.15s ease; }
  #prepSection.prep-collapsed .section-collapse-btn svg{ transform:rotate(-90deg); }
  .cat{ margin-bottom:14px; }
  .cat:last-child{ margin-bottom:0; }
  .cat-name{ font-size:calc(12.5px * var(--font-scale, 1)); font-weight:600; color:var(--navy-soft); margin:0 0 6px 2px; }
  .drag-handle{ width:20px;height:20px; flex:0 0 20px; color:var(--navy-soft); cursor:grab; touch-action:none; display:flex; align-items:center; justify-content:center; }
  .drag-handle:active{ cursor:grabbing; }
  .item{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px dotted var(--line); -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; flex-wrap:wrap; }
  .item:last-child{ border-bottom:none; }
  .item.custom-item{ background:rgba(232,163,61,0.07); border-radius:8px; padding-left:8px; padding-right:8px; }
  .item.dragging{ opacity:0.9; box-shadow:0 10px 24px rgba(0,0,0,0.18); border-radius:10px; background:var(--paper); position:relative; z-index:20; border-bottom:none; pointer-events:none; }
  .checkbox{ width:20px;height:20px; flex:0 0 20px; border-radius:6px; border:2px solid var(--navy-soft); display:flex; align-items:center; justify-content:center; transition:all 0.15s ease; cursor:pointer; }
  .item.checked .checkbox{ background:var(--green); border-color:var(--green); }
  .item.skipped .checkbox{ background:rgba(193,91,74,0.08); border-color:var(--red); color:var(--red); }
  .checkbox svg{ width:12px;height:12px; opacity:0; transition:opacity 0.15s ease; }

  .item.skipped .checkbox svg{ opacity:1; }

    flex:1; font-size:calc(14.5px * var(--font-scale, 1)); color:var(--navy); border:1px solid var(--amber); border-radius:6px;
    padding:4px 6px; font-family:var(--font-body);
  }
  .item-qty-input{
    width:42px; height:28px; flex:0 0 42px; padding:2px 4px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper-dim); color:var(--navy); font-family:var(--font-mono); font-size:calc(12px * var(--font-scale, 1));

  }

  .add-modal-layer{
    position:fixed; inset:0; z-index:1100; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(20,26,42,0.62);
  }

<body>
<div class="pass">
  <div class="header-strip">
    <div class="brand"><span class="brand-title">HamsterGo</span><span class="brand-separator"> · </span><span class="brand-subtitle">倉鼠打包小幫手</span></div>
    <div class="header-actions">

      </button>

      </button>

      <button class="settings-btn" id="settingsBtn" aria-label="開啟設定" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0L6.2 6.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
      <div class="sync-indicator" id="syncIndicator" data-state="idle" title="尚未同步" aria-label="尚未同步"><span class="sync-indicator-dot" aria-hidden="true"></span></div>
    </div>

  <div class="settings-panel" id="settingsPanel" aria-hidden='true'>

    <div class="settings-title">文字大小</div>

      <button class="font-option" data-font-scale="1">標準</button>
      <button class="font-option" data-font-scale="1.15">大</button>

      </div>

        <option value="gochi-hand">Gochi Hand</option>
        <option value="permanent-marker">Permanent Marker</option>
        <option value="caveat">Caveat</option>
        <option value="marker-felt">Marker Felt</option>
      </select>
    </label>
    <div class="settings-title data-title">雲端同步</div>
    <div class="sync-setting account-setting">
      <label for="accountUsername">帳號</label>

    <div class="sync-setting account-setting">

    </div>
    <div class="account-status" id="accountStatus" role="status" aria-live="polite"></div>
    <details class="legacy-sync-details">
      <summary>進階同步設定</summary>
    <div class="sync-setting">
      <label for="syncEndpoint">Worker 網址</label>
      <input id="syncEndpoint" type="url" placeholder="https://hamstergo-sync.xxx.workers.dev" autocomplete="off" spellcheck="false">

        </div>
      </div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function getData(){

  // 托運開啟時（國際線預設開啟，或國內線手動開啟），衣物類移到托運行李。

  return [

function currentDocItem(){
  return state.flightType === 'international'
    ? { id:'passport', label:'護照' }
    : { id:'license', label:'駕照錢包' };
}

const STORAGE_KEY = 'packing-checklist-v2';
const SYNC_API_URL_KEY = 'hamstergo-sync-api-url';
const SYNC_DEFAULT_ENDPOINT = 'https://hamstergo-sync.knbcnzcd2q.workers.dev';
const SYNC_KEY_KEY = 'hamstergo-sync-key';
const SYNC_ENCRYPTION_PASSWORD_KEY = 'hamstergo-sync-encryption-password';
const ENCRYPTION_ITERATIONS = 600000;
const AUTH_TOKEN_KEY = 'hamstergo-auth-token';
const ACCOUNT_USERNAME_KEY = 'hamstergo-account-username';
let state = { days:3, lensBuffer:2, moveMode:null, checklistLocked:false, completionPromptShown:false, checked:{}, customItems:{}, qtyValues:{}, prepCollapsed:null, prepWasComplete:false, recheckMode:false, editMode:false, flightType:'domestic', docPacked:{}, itemOrder:{}, checkedEnabled:false, carryOnEnabled:true, qtySettings:{}, tripStatus:'packing', tripTitle:'', flightInfoCollapsed:true, flights:[], flightOutboundCode:'', flightOutboundTime:'', flightOutboundAirport:'', flightOutboundTerminal:'', flightReturnCode:'', flightReturnTime:'', flightReturnAirport:'', flightReturnTerminal:'' };
let editingId = null; // custom item currently being renamed
let dragState = null; // active drag session
let addModalOpen = false;
let newTripConfirmOpen = false;
let recheckModeConfirmOpen = false;
let docUndoVisible = false;
let docUndoTimer = null;
let cloudSyncTimer = null;
let cloudSyncBusy = false;
let cloudSyncSuppress = false;

function daysQtyText(days){ return String(days); }
function normalizeLensBuffer(value){
  const parsed = Number.parseInt(value, 10);
  return Number.isFinite(parsed) ? Math.min(30, Math.max(0, parsed)) : 2;
}
function lensQtyText(days){ return String(days + normalizeLensBuffer(state.lensBuffer)); }

function getMainItemIds(){
  const ids = [ currentDocItem().id ];
  const data = getData();
  const visibleCatKeys = new Set();
  data.forEach(s => {
    if(s.key === 'checked' && !state.checkedEnabled) return;
    if(s.key === 'carry' && !state.carryOnEnabled) return;
    if(s.key === 'prep') return;
    s.cats.forEach(c => {
      visibleCatKeys.add(c.key);
      c.items.forEach(i => { ids.push(i.id); });
    });
  });
  Object.entries(state.customItems).forEach(([catKey, items]) => {
    if(!visibleCatKeys.has(catKey)) return;
    items.forEach(i => { ids.push(i.id); });
  });
  return ids;
}

function hasDefaultQty(item){
  return item.qty === 'days' || item.qty === 'lens' || item.qty === 'fixed' || item.followsDays;
}

function defaultQtyTextFor(item, days){
  if(item.qty === 'days') return daysQtyText(days);
  if(item.qty === 'lens') return lensQtyText(days);
  if(item.qty === 'fixed') return item.qtyText;
  if(item.followsDays) return daysQtyText(days);
  return null;
}

function getQtySetting(item){
  const saved = state.qtySettings[item.id];
  if(saved){
    return {
      show: saved.show !== false,
      mode: saved.mode === 'auto' ? 'auto' : 'fixed',
      value: Math.max(1, parseInt(saved.value, 10) || 1),
    };
  }
  return {
    show: hasDefaultQty(item),
    mode: hasDefaultQty(item) ? 'auto' : 'fixed',
    value: 1,
  };
}

function getCustomQtyConfig(item, days){
  const mode = item.qtyMode || (item.followsDays ? 'auto' : 'hide');
  if(mode === 'hide') return null;
  if(mode === 'auto') return { show:true, value: days };
  if(mode === 'fixed') return { show:true, value: Math.max(1, parseInt(item.qtyValue, 10) || 1) };
  return null;
}

function qtyTextFor(item){
  if(Object.prototype.hasOwnProperty.call(state.qtyValues || {}, item.id)){
    const value = String(state.qtyValues[item.id] ?? '');
    return value === '0' ? '' : value;
  }
  if(item.isCustom) return '';
  return defaultQtyTextFor(item, state.days) || '';
}

function setItemQty(itemId, value){
  state.qtyValues = state.qtyValues || {};
  const cleaned = String(value || '').replace(/[^0-9]/g, '').slice(0, 3);
  state.qtyValues[itemId] = cleaned === '0' ? '' : cleaned;
  saveState();
  render();
}

function setQtySetting(itemId, next){
  const current = state.qtySettings[itemId] || {};
  state.qtySettings[itemId] = Object.assign({ show: true, mode: 'fixed', value: 1 }, current, next);
  if(state.qtySettings[itemId].value < 1 || Number.isNaN(state.qtySettings[itemId].value)){
    state.qtySettings[itemId].value = 1;
  }
  saveState();
  render();
}

function getCustomItems(catKey){
  return state.customItems[catKey] || [];
}

function orderedItemsFor(cat){
  cat.items.forEach(i => { i.isCustom = false; });
  const customItems = getCustomItems(cat.key);
  customItems.forEach(i => { i.isCustom = true; });
  const all = cat.items.concat(customItems);
  const saved = state.itemOrder[cat.key];
  if(!saved) return all;
  const byId = {};
  all.forEach(i => { byId[i.id] = i; });
  const ordered = saved.filter(id => byId[id]).map(id => byId[id]);
  all.forEach(i => { if(!saved.includes(i.id)) ordered.push(i); });
  return ordered;
}

function getItemState(id){
  return Object.prototype.hasOwnProperty.call(state.checked, id) ? state.checked[id] : null;
}

function isItemChecked(id){
  return getItemState(id) === true;
}

function cycleItemState(id){
  if(state.checklistLocked) return;
  const current = getItemState(id);
  if(state.recheckMode){
    if(current === null) state.checked[id] = true;
    else if(current === true) delete state.checked[id];
    return;
  }
  if(current === null){
    state.checked[id] = true;
  }else if(current === true){
    state.checked[id] = false;
  }else{
    delete state.checked[id];
  }
}

function renderDocuments(){
  const docItem = currentDocItem();
  const done = isItemChecked(docItem.id);
  const packed = !!state.docPacked[docItem.id];
  const doneLabel = '已收好';

  document.getElementById('docActive').style.display = '';
  const doneEl = document.getElementById('docDone');
  doneEl.style.display = done ? 'flex' : 'none';
  if(done){
    const typeLabel = state.flightType === 'international' ? '國際線' : '國內線';
    doneEl.innerHTML = '';
    const doneText = document.createElement('span');
    doneText.textContent = "✓ " + docItem.label + doneLabel + "（" + typeLabel + "）";
    doneEl.appendChild(doneText);
    if(docUndoVisible && !state.editMode){
      const undoBtn = document.createElement("button");
      undoBtn.type = "button";
      undoBtn.className = "doc-undo-btn";
      undoBtn.textContent = "返回";
      undoBtn.title = "返回尚未收好";
      undoBtn.addEventListener("click", () => {
        docUndoVisible = false;
        if(docUndoTimer) clearTimeout(docUndoTimer);
        docUndoTimer = null;
        state.checklistLocked = false;
        delete state.checked[docItem.id];
        saveState();
        render();
      });
      doneEl.appendChild(undoBtn);
    }
    if(state.editMode){
      const undoBtn = document.createElement('button');
      undoBtn.type = 'button';
      undoBtn.className = 'doc-undo-btn';
      undoBtn.textContent = '退回';
      undoBtn.title = '退回未收好';
      undoBtn.addEventListener('click', () => {
        delete state.checked[docItem.id];
        state.docPacked[docItem.id] = true;
        saveState();
        render();
      });
      doneEl.appendChild(undoBtn);
    }
  }

  document.getElementById('flightToggle').style.display = packed || state.recheckMode ? 'none' : '';
  document.getElementById('docNote').style.display = done || state.recheckMode ? 'none' : '';
  document.querySelectorAll('#flightToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === state.flightType);
  });

  const rowContainer = document.getElementById('docItemRow');
  rowContainer.innerHTML = '';
  if(!done){
    rowContainer.appendChild(state.recheckMode && state.moveMode === 'move' ? buildMoveDocRow(docItem) : buildDocRow(docItem));
  }
}

function buildMoveDocRow(docItem){
  const row = document.createElement("div");
  row.className = "doc-row";
  const label = document.createElement("div");
  label.className = "doc-row-label";
  label.textContent = docItem.label;
  row.appendChild(label);
  const confirmBtn = document.createElement("button");
  confirmBtn.type = "button";
  confirmBtn.className = "stage-btn move-doc-confirm";
  confirmBtn.textContent = "證件已收好";
  confirmBtn.addEventListener("click", () => {
    if(state.checklistLocked) return;
    state.checked[docItem.id] = true;
    state.checklistLocked = true;
    showDocUndo();
    saveState();
    render();
  });
  row.appendChild(confirmBtn);
  return row;
}

function buildDocRow(docItem){
  const packed = !!state.docPacked[docItem.id];
  const row = document.createElement('div');
  row.className = 'doc-row';

  const label = document.createElement('div');
  label.className = 'doc-row-label';
  label.textContent = docItem.label;
  row.appendChild(label);

  const stageWrap = document.createElement('div');
  stageWrap.className = 'doc-stage';

  const stage1 = document.createElement('button');
  stage1.className = 'stage-btn' + (packed ? ' done' : '');
  stage1.textContent = '① 帶了';
  stage1.addEventListener('click', () => {
    state.docPacked[docItem.id] = !state.docPacked[docItem.id];
    saveState();
    renderDocuments();
    updateProgress();
  });
  stageWrap.appendChild(stage1);

  const stage2 = document.createElement('button');
  stage2.className = 'stage-btn' + (packed ? '' : ' disabled');
  stage2.textContent = '② 已收好';
  if(packed){
    stage2.addEventListener('click', () => {
      if(state.checklistLocked) return;
      state.checked[docItem.id] = true;
      state.checklistLocked = true;
      showDocUndo();
      saveState();
      render();
    });
  }
  stageWrap.appendChild(stage2);

  row.appendChild(stageWrap);
  return row;
}

function isPrepComplete(){
  const section = getData().find(s => s.key === 'prep');
  if(!section) return false;
  const ids = [];
  section.cats.forEach(cat => cat.items.forEach(item => ids.push(item.id)));
  (state.customItems.prepTasks || []).forEach(item => ids.push(item.id));
  return ids.length > 0 && ids.every(id => getItemState(id) === true);
}







function emptyFlight(){ return { code:"", time:"", airportTerminal:"" }; }

function getFlights(){
  if(!Array.isArray(state.flights)){
    state.flights = [
      { code:state.flightOutboundCode || "", time:state.flightOutboundTime || "", airportTerminal:[state.flightOutboundAirport, state.flightOutboundTerminal].filter(Boolean).join(" ") },
      { code:state.flightReturnCode || "", time:state.flightReturnTime || "", airportTerminal:[state.flightReturnAirport, state.flightReturnTerminal].filter(Boolean).join(" ") }
    ];
  }
  while(state.flights.length < 2) state.flights.push(emptyFlight());
  return state.flights;
}

function formatFlightTimeInput(value){
  const digits = String(value || "").replace(/\D/g, "").slice(0, 12);
  if(!digits) return "";
  let formatted = digits.slice(0, 4);
  if(digits.length >= 4) formatted += "/";
  if(digits.length > 4) formatted += digits.slice(4, 6);
  if(digits.length >= 6) formatted += "/";
  if(digits.length > 6) formatted += digits.slice(6, 8);
  if(digits.length >= 8) formatted += ", ";
  if(digits.length > 8) formatted += digits.slice(8, 10);
  if(digits.length >= 10) formatted += ":";
  if(digits.length > 10) formatted += digits.slice(10, 12);
  return formatted;
}

function formatFlightTime(value){
  const digits = String(value || "").replace(/\D/g, "");
  if(digits.length < 12) return formatFlightTimeInput(value);
  const hour = Number(digits.slice(8, 10));
  const suffix = hour >= 12 ? "PM" : "AM";
  const hour12 = hour % 12 || 12;
  return digits.slice(0,4) + "/" + digits.slice(4,6) + "/" + digits.slice(6,8) + ", " + String(hour12).padStart(2, "0") + ":" + digits.slice(10,12) + " " + suffix;
}


function flightTimestamp(flight){
  const digits = String(flight.time || "").replace(/\D/g, "");
  if(digits.length < 12) return null;
  return new Date(Number(digits.slice(0,4)), Number(digits.slice(4,6)) - 1, Number(digits.slice(6,8)), Number(digits.slice(8,10)), Number(digits.slice(10,12))).getTime();
}

function flightSummary(flight){
  const firstLine = [flight.code, formatFlightTime(flight.time)].filter(Boolean).join(" ");
  return [firstLine, flight.airportTerminal].filter(Boolean).join("\n");
}

function renderFlightSummary(){
  const flights = getFlights();
  const now = Date.now();
  const upcoming = flights.filter(flight => { const time = flightTimestamp(flight); return time === null || time > now; }).sort((a,b) => (flightTimestamp(a) ?? Infinity) - (flightTimestamp(b) ?? Infinity));
  const dated = flights.filter(flight => flightTimestamp(flight) !== null).sort((a,b) => flightTimestamp(b) - flightTimestamp(a));
  const current = upcoming.find(flight => flightSummary(flight)) || dated[0] || flights.find(flight => flightSummary(flight));
  document.getElementById("flightInfoSummary").textContent = current ? (flightSummary(current) || "尚未填寫航班") : "尚未填寫航班";
}

function renderFlightEditor(){
  const body = document.getElementById("flightInfoBody");
  body.innerHTML = "";
  getFlights().forEach((flight, index) => {
    const row = document.createElement("div");
    row.className = "flight-leg";
    const title = document.createElement("div");
    title.className = "flight-leg-title";
    title.dataset.flightTitle = String(index);
    title.textContent = flightSummary(flight) || ("航班 " + (index + 1));
    if(getFlights().length > 2){
      const remove = document.createElement("button");
      remove.type = "button"; remove.className = "flight-leg-remove"; remove.textContent = "移除"; remove.dataset.flightRemove = String(index);
      title.appendChild(remove);
    }
    row.appendChild(title);
    [["code","航班編號","text"],["time","出發時間","text"],["airportTerminal","機場／航廈","text"]].forEach(([field, labelText, type]) => {
      const label = document.createElement("label"); label.className = "flight-info-field"; label.textContent = labelText;
      const input = document.createElement("input"); input.type = type; input.maxLength = field === "time" ? 18 : (field === "airportTerminal" ? 24 : 40); input.autocomplete = "off"; input.dataset.flightIndex = String(index); input.dataset.flightField = field;
      if(field === "time"){ input.inputMode = "numeric"; input.placeholder = "YYYYMMDDHHmm"; }
      input.value = field === "time" ? formatFlightTimeInput(flight[field]) : (flight[field] || ""); label.appendChild(input); row.appendChild(label);
    });
    body.appendChild(row);
    row.querySelectorAll("input").forEach(input => { input.value = input.dataset.flightField === "time" ? formatFlightTimeInput(flight[input.dataset.flightField]) : (flight[input.dataset.flightField] || ""); });
  });
  const add = document.createElement("button");
  add.type = "button"; add.className = "secondary-btn flight-add-btn"; add.textContent = "＋ 新增航班";
  body.appendChild(add);
}

function toggleFlightInfo(){
  state.flightInfoCollapsed = state.flightInfoCollapsed === false;
  renderFlightInfo();
  saveState();
}


function renderFlightInfo(){
  renderFlightSummary();
  const body = document.getElementById("flightInfoBody");
  const editing = state.flightInfoCollapsed === false;
  document.getElementById("flightInfo").classList.toggle("editing", editing);
  body.hidden = !editing;
  document.getElementById("flightInfoToggle").setAttribute("aria-expanded", String(editing));
  document.getElementById("flightInfoToggle").setAttribute("aria-label", editing ? "完成航班編輯" : "編輯航班資訊");
  if(editing) renderFlightEditor();
  else body.innerHTML = "";
}


function render(){
  renderFlightInfo();
  closeAllCatLists();
  document.querySelectorAll('.cat-select-list').forEach(el => el.remove());
  renderDocuments();
  getData().forEach(section => {
    const container = document.getElementById(section.target);
    container.querySelectorAll('.cat').forEach(el => el.remove());
    if(section.key === 'checked' && !state.checkedEnabled){
      return;
    }
    if(section.key === 'carry' && !state.carryOnEnabled){
      return;
    }
    section.cats.forEach(cat => {
      const catEl = document.createElement('div');
      catEl.className = 'cat';
      catEl.dataset.catKey = cat.key;
      if(cat.name){
        const nameEl = document.createElement('p');
        nameEl.className = 'cat-name';
        nameEl.textContent = cat.name;
        catEl.appendChild(nameEl);
      }

      orderedItemsFor(cat).forEach(item => {
        catEl.appendChild(buildItemRow(item, item.isCustom, cat.key));
      });

      container.appendChild(catEl);
    });

  });
  const prepComplete = isPrepComplete();
  if(prepComplete && !state.prepWasComplete){
    state.prepCollapsed = true;
  }else if(!prepComplete && state.prepWasComplete){
    state.prepCollapsed = false;
  }else if(state.prepCollapsed === null){
    state.prepCollapsed = prepComplete;
  }
  state.prepWasComplete = prepComplete;
  document.getElementById('prepSection').classList.toggle('prep-collapsed', state.prepCollapsed === true);
  const prepToggle = document.getElementById('prepToggle');
  const prepIsCollapsed = state.prepCollapsed === true;
  prepToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>';
  prepToggle.setAttribute('aria-expanded', String(!prepIsCollapsed));
  prepToggle.setAttribute('aria-label', prepIsCollapsed ? '展開出發前提醒' : '收起出發前提醒');
  prepToggle.setAttribute('title', prepIsCollapsed ? '展開' : '收起');
  renderGlobalAddRow();
  document.getElementById('checkedToggle').classList.toggle('on', !!state.checkedEnabled);
  document.getElementById('carryOnToggle').classList.toggle('on', !!state.carryOnEnabled);
  const documentLocked = isItemChecked(currentDocItem().id);
  document.getElementById('checkedToggle').classList.toggle('recheck-locked', !!state.recheckMode || documentLocked);
  document.getElementById('carryOnToggle').classList.toggle('recheck-locked', !!state.recheckMode || documentLocked);
  updateProgress();
  document.getElementById('editToggle').classList.toggle('active', state.editMode);
  document.getElementById('editToggle').setAttribute('aria-label', state.editMode ? '完成編輯' : '編輯項目');
  document.getElementById('editToggle').setAttribute('title', state.editMode ? '完成編輯' : '編輯項目');
}

    state.customItems[catKey].push({ id, label }); addModalOpen = false; saveState(); render();

function beginRecheck(mode){
  const prepIds = new Set();
  const prepSection = getData().find(section => section.key === "prep");
  prepSection?.cats.forEach(cat => cat.items.forEach(item => prepIds.add(item.id)));
  (state.customItems.prepTasks || []).forEach(item => prepIds.add(item.id));
  Object.keys(state.checked).forEach(id => {
    if(state.checked[id] === true && !prepIds.has(id)) delete state.checked[id];
  });
  docUndoVisible = false;
  if(docUndoTimer) clearTimeout(docUndoTimer);
  docUndoTimer = null;
  state.checklistLocked = false;
  state.completionPromptShown = false;
  state.docPacked = {};
  const recheckDocId = currentDocItem().id;
  delete state.checked[recheckDocId];
  delete state.docPacked[recheckDocId];
  if(mode === "move") state.docPacked[recheckDocId] = true;
  state.moveMode = mode;
  state.recheckMode = true;
  state.tripStatus = "packing";
  render(); saveState();
}

function buildItemRow(item, isCustom, catKey){
  const row = document.createElement('div');
  const itemState = getItemState(item.id);
  const isPrepItem = catKey === 'prepTasks';
  const prepChecked = isPrepItem && itemState === true;
  row.className = 'item' + (isCustom ? ' custom-item' : '') + (!isPrepItem && itemState === true ? ' checked' : '') + (!isPrepItem && itemState === false ? ' skipped' : '') + (prepChecked ? ' checked' : '') + (state.checklistLocked ? ' checklist-locked' : '');
  row.dataset.id = item.id;
  row.dataset.custom = isCustom ? '1' : '0';

  const box = document.createElement('div');
  box.className = 'checkbox';
  box.innerHTML = isPrepItem ? (prepChecked ? CHECK_SVG : '') : (itemState === false ? X_SVG : CHECK_SVG);
  box.style.cursor = state.editMode || state.checklistLocked ? 'default' : 'pointer';
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', () => {
    if(state.editMode || state.checklistLocked) return;
    if(isPrepItem){
      if(state.recheckMode){
        if(itemState === null) state.checked[item.id] = true;
        else if(itemState === true) delete state.checked[item.id];
        saveState();
        render();
      }else if(itemState === true){
        delete state.checked[item.id];
        saveState();
        render();
      }else{
        state.checked[item.id] = true;
        saveState();
        render();
      }
      return;
    }
    toggleItem(item.id);
  });
  row.appendChild(box);

  if(isCustom && state.editMode && editingId === item.id){
    const input = document.createElement('input');
    input.className = 'item-label-input';
    input.value = item.label;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') input.blur(); });
    input.addEventListener('blur', () => {
      const val = input.value.trim();
      if(val) item.label = val;
      editingId = null;
      saveState();
      render();
    });
    row.appendChild(input);
    setTimeout(() => { input.focus(); input.select(); }, 0);
  } else {
    const label = document.createElement('div');
    label.className = 'item-label';
    label.textContent = item.label;
    label.style.cursor = (state.editMode || isPrepItem || state.checklistLocked) ? 'default' : 'pointer';
    if(!isPrepItem){
      label.addEventListener('mousedown', e => e.preventDefault());
      label.addEventListener('click', () => { if(!state.editMode) toggleItem(item.id); });
    }
    row.appendChild(label);
  }

  const qtyInput = document.createElement('input');
  qtyInput.type = 'number'; qtyInput.min = '1'; qtyInput.max = '999'; qtyInput.inputMode = 'numeric';
  qtyInput.className = 'item-qty-input'; qtyInput.value = qtyTextFor(item);
  qtyInput.placeholder = ''; qtyInput.readOnly = !state.editMode;
  qtyInput.setAttribute('aria-label', item.label + '數量');
  qtyInput.addEventListener('click', e => e.stopPropagation());
  qtyInput.addEventListener('change', () => setItemQty(item.id, qtyInput.value));
  row.appendChild(qtyInput);

  if(isCustom && state.editMode){
    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn';
    editBtn.innerHTML = PENCIL_SVG;
    editBtn.addEventListener('click', () => { editingId = item.id; render(); });
    row.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn delete';
    delBtn.innerHTML = TRASH_SVG;
    delBtn.addEventListener('click', () => deleteCustomItem(catKey, item.id));
    row.appendChild(delBtn);
  }

  if(state.editMode){
    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.innerHTML = DRAG_SVG;
    row.appendChild(handle);


  }

  return row;
}

function deleteCustomItem(catKey, id){
  state.customItems[catKey] = (state.customItems[catKey] || []).filter(i => i.id !== id);
  delete state.checked[id];
  if(state.qtySettings) delete state.qtySettings[id];
  saveState();
  render();
}

function updateProgress(){
  const docId = currentDocItem().id;
  const ids = allItemIds();
  const progressIds = ids.filter(id => getItemState(id) !== false);
  const total = progressIds.length;
  const docStored = !!state.docPacked[docId] && getItemState(docId) === true;
  const docProgressDone = state.recheckMode && state.moveMode === "move" ? docStored : !!state.docPacked[docId];
  const packingPending = progressIds.filter(id => id === docId ? !docProgressDone : getItemState(id) === null).length;
  const readyPending = packingPending + (docStored ? 0 : 1);
  const done = progressIds.filter(id => id === docId ? docProgressDone : getItemState(id) === true).length;

  const otherPending = progressIds.filter(id => id !== docId && getItemState(id) === null).length;
  const isMoveMode = state.recheckMode && state.moveMode === 'move';
  const docOnlyPending = !state.recheckMode && !state.docPacked[docId] && total > 0 && otherPending === 0;
  const moveDocOnlyPending = isMoveMode && total > 0 && !state.checked[docId] && otherPending === 0;
  const returnMode = state.recheckMode && state.moveMode === 'return';
  const returnDocOnlyPending = returnMode && total > 0 && !state.docPacked[docId] && otherPending === 0;
  const docOnlyStatus = docOnlyPending || moveDocOnlyPending || returnDocOnlyPending;
  const statusText = docOnlyStatus
    ? '只剩證件未確認'
    : state.recheckMode
    ? (returnMode
      ? (packingPending > 0
        ? '準備回家！<span class="status-pending">還有 ' + packingPending + ' 件物品尚未確認</span>'
        : (docStored ? 'Bon voyage! 🛫' : '安心回家！'))
      : (packingPending > 0
        ? '準備移動了！<span class="status-pending">還有 ' + packingPending + ' 件物品尚未確認</span>'
        : '可以移動了！'))
    : (packingPending > 0
      ? '要出發了！<span class="status-pending">還有 ' + packingPending + ' 件物品沒帶</span>'
      : (docStored ? 'Bon voyage! 🛫' : '行李都整理好了！ ✈️'));
  state.tripStatus = docStored && packingPending === 0 ? 'packed' : 'packing';

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('pctHeadline').innerHTML = statusText;
  const statusSubtitle = document.getElementById('statusSubtitle');
  statusSubtitle.textContent = docOnlyStatus ? '別忘了證件噢 👀' : (returnMode ? '別忘了把所有東西帶回家' : (isMoveMode ? '移動前確認每一件物品都帶上了' : '出發前確認每一件東西都裝進行李'));
  statusSubtitle.style.display = docOnlyStatus || (returnMode || isMoveMode || !state.recheckMode) && packingPending > 0 ? '' : 'none';
  const recheckBtn = document.getElementById('recheckBtn');
  const canRecheck = readyPending === 0;
  recheckBtn.style.display = canRecheck ? 'inline-flex' : 'none';
  recheckBtn.setAttribute('aria-hidden', String(!canRecheck));
  document.getElementById('dayVal').value = state.days;
  document.getElementById('lensBuffer').value = state.lensBuffer;
 }

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error('save failed', e); }
  scheduleCloudUpload();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({ days:3, lensBuffer:2, moveMode:null, checklistLocked:false, completionPromptShown:false, checked:{}, customItems:{}, qtyValues:{}, prepCollapsed:null, prepWasComplete:false, recheckMode:false, editMode:false, flightType:'domestic', docPacked:{}, itemOrder:{}, checkedEnabled:false, carryOnEnabled:true, qtySettings:{}, tripStatus:'packing', tripTitle:'', flightInfoCollapsed:true, flights:[], flightOutboundCode:'', flightOutboundTime:'', flightOutboundAirport:'', flightOutboundTerminal:'', flightReturnCode:'', flightReturnTime:'', flightReturnAirport:'', flightReturnTerminal:'' }, parsed);
      delete state.itemPlacement;
      state.qtySettings = state.qtySettings || {};
      state.qtyValues = state.qtyValues || {};
      state.lensBuffer = normalizeLensBuffer(state.lensBuffer);
      state.moveMode = state.moveMode === 'move' || state.moveMode === 'return' ? state.moveMode : null;
      state.checklistLocked = state.checklistLocked === true;
      state.completionPromptShown = state.completionPromptShown === true;
      state.tripStatus = state.tripStatus === 'packed' ? 'packed' : 'packing';
      state.tripTitle = typeof state.tripTitle === 'string' ? state.tripTitle : '';
    }
  }catch(e){ /* first run, no saved state */ }
  render();
}

function safeFileName(name){
  const cleaned = String(name || 'HamsterGo-旅行紀錄').trim().replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ');
  return (cleaned || 'HamsterGo-旅行紀錄').slice(0, 80);
}

function exportTrip(){
  const payload = {
    format: 'HamsterGo Travel',
    version: 1,
    exportedAt: new Date().toISOString(),
    tripTitle: state.tripTitle || '',
    state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = safeFileName(state.tripTitle) + '.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importTripFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const payload = JSON.parse(reader.result);
      const imported = payload && payload.state && typeof payload.state === 'object' ? payload.state : payload;
      if(!imported || typeof imported !== 'object' || Array.isArray(imported) || !imported.checked || !imported.customItems){
        throw new Error('invalid travel file');
      }
      const defaults = { days:3, lensBuffer:2, moveMode:null, checklistLocked:false, completionPromptShown:false, checked:{}, customItems:{}, qtyValues:{}, prepCollapsed:null, prepWasComplete:null, recheckMode:false, editMode:false, flightType:'domestic', docPacked:{}, itemOrder:{}, checkedEnabled:false, carryOnEnabled:true, qtySettings:{}, tripStatus:'packing', tripTitle:'', flightInfoCollapsed:true, flights:[], flightOutboundCode:'', flightOutboundTime:'', flightOutboundAirport:'', flightOutboundTerminal:'', flightReturnCode:'', flightReturnTime:'', flightReturnAirport:'', flightReturnTerminal:'' };
      state = Object.assign(defaults, imported);
      state.editMode = false;
      state.qtySettings = state.qtySettings || {};
      state.qtyValues = state.qtyValues || {};
      state.lensBuffer = normalizeLensBuffer(state.lensBuffer);
      state.moveMode = state.moveMode === 'move' || state.moveMode === 'return' ? state.moveMode : null;
      state.checklistLocked = state.checklistLocked === true;
      state.completionPromptShown = state.completionPromptShown === true;
      state.tripTitle = typeof state.tripTitle === 'string' ? state.tripTitle : (typeof payload.tripTitle === 'string' ? payload.tripTitle : '');
      editingId = null;
      dragState = null;
      render();
      document.getElementById('tripTitle').value = state.tripTitle;
      saveState();
    }catch(e){
      alert('這不是有效的 HamsterGo 旅行 JSON 檔案。');
    }
  };
  reader.readAsText(file);
}

function toggleItem(id){
  cycleItemState(id);
  render();
  saveState();
}

document.getElementById('tripTitle').value = state.tripTitle || '';
document.getElementById('tripTitle').addEventListener('input', e => {
  state.tripTitle = e.target.value;

function swapItemNodes(dragEl, sib, direction){
  const rect = sib.getBoundingClientRect();
  const style = getComputedStyle(sib);
  const height = rect.height + parseFloat(style.marginTop || 0) + parseFloat(style.marginBottom || 0);
  if(direction === 'down'){
    sib.parentNode.insertBefore(sib, dragEl);
    dragState.startY += height;
  } else {
    sib.parentNode.insertBefore(dragEl, sib);
    dragState.startY -= height;
  }
}

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.drag-handle');
  if(!handle) return;
  const itemEl = handle.closest('.item');
  if(!itemEl) return;
  const container = itemEl.closest('.cat');
  if(!container) return;
  e.preventDefault();
  dragState = { itemEl, container, pointerId: e.pointerId, startY: e.clientY };
  itemEl.classList.add('dragging');
  try{ itemEl.setPointerCapture(e.pointerId); }catch(err){ /* not supported */ }
});

document.addEventListener('pointermove', e => {
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  const dy = e.clientY - dragState.startY;
  dragState.itemEl.style.transform = `translateY(${dy}px)`;

  const siblings = Array.from(dragState.container.querySelectorAll('.item')).filter(el => el !== dragState.itemEl);
  const dragRect = dragState.itemEl.getBoundingClientRect();
  const dragCenter = dragRect.top + dragRect.height / 2;

  for(const sib of siblings){
    const rect = sib.getBoundingClientRect();
    const sibCenter = rect.top + rect.height / 2;
    const dragIsBefore = !!(dragState.itemEl.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
    if(dragIsBefore && dragCenter > sibCenter){
      swapItemNodes(dragState.itemEl, sib, 'down');
      dragState.itemEl.style.transform = `translateY(${e.clientY - dragState.startY}px)`;
      break;
    } else if(!dragIsBefore && dragCenter < sibCenter){
      swapItemNodes(dragState.itemEl, sib, 'up');
      dragState.itemEl.style.transform = `translateY(${e.clientY - dragState.startY}px)`;
      break;
    }
  }
});

function endItemDrag(e){
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  const { itemEl, container } = dragState;
  itemEl.classList.remove('dragging');
  itemEl.style.transform = '';
  try{ itemEl.releasePointerCapture(e.pointerId); }catch(err){ /* already released */ }
  const order = Array.from(container.querySelectorAll('.item')).map(el => el.dataset.id);
  state.itemOrder[container.dataset.catKey] = order;
  dragState = null;
  saveState();
}

async function accountRequest(path, body){
  const endpoint = syncEndpointInput.value.trim().replace(/\/$/, '') || SYNC_DEFAULT_ENDPOINT;

  const result = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(result.error || ('HTTP ' + response.status));
  return result;
}

function saveSyncSettings(){

function createSyncKey(){
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

function syncRequestReady(){
  const endpoint = syncEndpointInput.value.trim().replace(/\/$/, '') || SYNC_DEFAULT_ENDPOINT;
  if(authToken) return { endpoint, authToken };
  const syncKey = syncKeyInput.value.trim();
  if(!endpoint || !/^https?:\/\//i.test(endpoint)){ setSyncStatus('請先設定同步服務。', true); return null; }
  if(!/^[A-Za-z0-9_-]{32,64}$/.test(syncKey)){ setSyncStatus('請先登入，或在進階設定輸入同步碼。', true); return null; }
  saveSyncSettings();
  return { endpoint, syncKey };
}

function bytesToBase64(bytes){
  let binary = '';
  for(const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function base64ToBytes(value){
  const binary = atob(value);
  return Uint8Array.from(binary, char => char.charCodeAt(0));
}

async function deriveEncryptionKey(password, salt){
  const material = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(password),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ENCRYPTION_ITERATIONS, hash:'SHA-256' },
    material,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptState(value, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveEncryptionKey(password, salt);
  const plaintext = new TextEncoder().encode(JSON.stringify(value));
  const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, plaintext);
  return {
    format:'HamsterGo encrypted sync',
    version:1,
    algorithm:'AES-GCM',
    kdf:'PBKDF2-SHA-256',
    iterations:ENCRYPTION_ITERATIONS,
    salt:bytesToBase64(salt),
    iv:bytesToBase64(iv),
    ciphertext:bytesToBase64(new Uint8Array(ciphertext))
  };
}

async function decryptState(payload, password){
  if(!payload || payload.format !== 'HamsterGo encrypted sync' || payload.version !== 1){
    throw new Error('unsupported encrypted payload');
  }
  const salt = base64ToBytes(payload.salt);
  const iv = base64ToBytes(payload.iv);
  const ciphertext = base64ToBytes(payload.ciphertext);
  const key = await deriveEncryptionKey(password, salt);
  const plaintext = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ciphertext);
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function syncEncryptionPasswordReady(){
  const password = authToken ? accountPasswordInput.value : document.getElementById('syncEncryptionPassword').value;
  if(password.length < 8){
    setSyncStatus('請輸入至少 8 個字元的加密密碼。', true);
    return null;
  }
  return password;
}

function scheduleCloudUpload(){
  const endpoint = document.getElementById('syncEndpoint')?.value.trim();
  const syncKey = document.getElementById('syncKey')?.value.trim();
  const password = document.getElementById('syncEncryptionPassword')?.value;
  if(cloudSyncSuppress || cloudSyncTimer || !endpoint || (!authToken && !syncKey) || !password) return;
  cloudSyncTimer = setTimeout(() => {
    cloudSyncTimer = null;
    if((authToken ? accountPasswordInput.value : document.getElementById('syncEncryptionPassword')?.value)) uploadStateToCloud(true);
  }, 1800);
}

async function uploadStateToCloud(isAutomatic = false){
  const settings = syncRequestReady();
  if(!settings) return;
  const password = syncEncryptionPasswordReady();
  if(!password) return;
  if(cloudSyncBusy) return;
  cloudSyncBusy = true;
  setSyncStatus(isAutomatic ? '正在自動同步…' : '正在加密並上傳…');
  try{
    const payload = await encryptState(state, password);
    const response = await fetch(settings.endpoint + (settings.authToken ? '/me/record' : '/record'), {
      method:'PUT',
      headers:{'content-type':'application/json', authorization:'Bearer ' + (settings.authToken || settings.syncKey)},
      body:JSON.stringify({payload})
    });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    setSyncStatus('已加密上傳到雲端 · ' + new Date(result.updatedAt).toLocaleString());
  }catch(e){
    setSyncStatus('上傳失敗，請確認 Worker、同步碼與加密密碼。', true);
  } finally {
    cloudSyncBusy = false;
  }
}

async function downloadStateFromCloud(){
  const settings = syncRequestReady();
  if(!settings) return;
  const password = syncEncryptionPasswordReady();
  if(!password) return;
  setSyncStatus('正在下載並解密…');
  try{
    const response = await fetch(settings.endpoint + (settings.authToken ? '/me/record' : '/record'), { headers:{authorization:'Bearer ' + (settings.authToken || settings.syncKey)} });
    if(response.status === 404){
      setSyncStatus('雲端還沒有資料，請先上傳。', true);
      return;
    }
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const remote = await response.json();
    if(remote.state){
      throw new Error('legacy_plaintext_record');
    }
    const remoteState = await decryptState(remote.payload, password);
    if(!remoteState || typeof remoteState !== 'object' || Array.isArray(remoteState) || !remoteState.checked || !remoteState.customItems){
      throw new Error('invalid state');
    }
    cloudSyncSuppress = true;
    state = Object.assign({}, state, remoteState);
    state.editMode = false;
    state.moveMode = null;
    editingId = null;
    dragState = null;
    render();
    document.getElementById('tripTitle').value = state.tripTitle || '';
    saveState();
    setSyncStatus('已解密並下載 · ' + new Date(remote.updatedAt).toLocaleString());
    cloudSyncSuppress = false;
  }catch(e){
    cloudSyncSuppress = false;
    if(e.message === 'legacy_plaintext_record') setSyncStatus('這是舊版未加密資料，請先用新版本上傳覆蓋。', true);
    else setSyncStatus('解密失敗，請確認加密密碼是否正確。', true);
  }
}
